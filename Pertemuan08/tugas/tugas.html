<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pendaftaran Kursus</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="form-card">
        <header class="form-header">
          <span class="label-top">PENDAFTARAN KURSUS</span>
          <h1>Form Pendaftaran Kursus</h1>
          <p>Lengkapi data berikut untuk mendaftar kursus.</p>
          <p class="required-info">* Wajib diisi</p>
        </header>

        <form action="#" method="post" enctype="multipart/form-data">
          <div class="form-group">
            <label for="nama">Nama Lengkap *</label>
            <input
              type="text"
              id="nama"
              name="nama"
              placeholder="Contoh: Farid Zhahir"
              minlength="3"
              maxlength="60"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nama@email.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="telepon">Nomor Telepon *</label>
            <input
              type="tel"
              id="telepon"
              name="telepon"
              inputmode="numeric"
              pattern="[0-9]{10,13}"
              maxlength="13"
              placeholder="Contoh: 081234567890"
              required
            />
            <small>Masukkan 10-13 digit angka tanpa spasi.</small>
          </div>

          <div class="form-group">
            <label for="kursus">Pilih Kursus *</label>
            <select id="kursus" name="kursus" required>
              <option value="">-- Pilih Kursus --</option>
              <option value="web-development">Web Development</option>
              <option value="desain-ui-ux">Desain UI/UX</option>
              <option value="digital-marketing">Digital Marketing</option>
            </select>
          </div>

          <fieldset>
            <legend>Mode Belajar *</legend>
            <div class="option">
              <input
                type="radio"
                id="online"
                name="mode_belajar"
                value="online"
                required
              />
              <label for="online">Online</label>
            </div>
            <div class="option">
              <input
                type="radio"
                id="offline"
                name="mode_belajar"
                value="offline"
              />
              <label for="offline">Tatap muka</label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Materi yang Diminati</legend>
            <p class="instruction">Pilih materi yang ingin dipelajari.</p>
            <div class="option">
              <input type="checkbox" id="html" name="materi[]" value="html" />
              <label for="html">HTML</label>
            </div>
            <div class="option">
              <input type="checkbox" id="css" name="materi[]" value="css" />
              <label for="css">CSS</label>
            </div>
            <div class="option">
              <input
                type="checkbox"
                id="javascript"
                name="materi[]"
                value="javascript"
              />
              <label for="javascript">JavaScript</label>
            </div>
          </fieldset>

          <div class="form-group">
            <label for="motivasi">Alasan Mengikuti Kursus *</label>
            <textarea
              id="motivasi"
              name="motivasi"
              rows="5"
              minlength="20"
              maxlength="300"
              placeholder="Tuliskan alasan mengikuti kursus (minimal 20 karakter)"
              required
            ></textarea>
            <small>Masukkan 20-300 karakter.</small>
          </div>

          <div class="form-group">
            <label for="bukti">Unggah Bukti Pembayaran *</label>
            <input
              type="file"
              id="bukti"
              name="bukti"
              accept=".pdf,.jpg,.jpeg,.png"
              required
            />
            <small>Format file yang disarankan: PDF, JPG, atau PNG.</small>
          </div>

          <div class="agreement">
            <input
              type="checkbox"
              id="persetujuan"
              name="persetujuan"
              value="setuju"
              required
            />
            <label for="persetujuan">Saya menyatakan data yang diisi benar. *</label>
          </div>

          <div class="button-group">
            <button
              type="button"
              class="btn btn-tertiary"
              onclick="this.form.reportValidity()"
            >
              Periksa Form
            </button>
            <button type="submit" class="btn btn-primary">
              Kirim Pendaftaran
            </button>
            <button type="reset" class="btn btn-secondary">Reset Form</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
